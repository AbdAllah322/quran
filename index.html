<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>المصحف</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf6;--fg:#1c1b19;--card:#fff;--mut:#7a766c;--ac:#0f766e;--bd:#e6e2d6;--hl:#fde68a}
[data-theme=dark]{--bg:#12161a;--fg:#e8e6e1;--card:#1b2127;--mut:#98a0a8;--ac:#2dd4bf;--bd:#2a323a;--hl:#3b3a1e}
[data-theme=sepia]{--bg:#f4ecd8;--fg:#3b2f1e;--card:#fbf4e2;--mut:#8a7a5c;--ac:#8a5a14;--bd:#e0d3b3;--hl:#f2d98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Cairo,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:10px 14px}
header h1{font-size:18px;margin:0;flex:1}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#main{padding:12px 14px 150px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 4px;color:var(--mut)}
nav button.on{color:var(--ac);font-weight:700}
input[type=search]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.num{min-width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--ac);color:var(--ac);border-radius:50%;font-size:13px}
.row .t{flex:1}.row small{color:var(--mut)}
.ar{font-family:'Amiri Quran',serif}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button{padding:14px 0}
#rd{font-family:'Amiri Quran',serif;line-height:2.4;text-align:justify;font-size:var(--fs,28px)}
.sh{text-align:center;margin:22px 0 8px;padding:10px;border:2px double var(--ac);border-radius:12px;color:var(--ac);font-size:1.1em}
.bsm{text-align:center;margin-bottom:8px}
.ay{display:inline}.a{cursor:pointer;border-radius:8px}
.a.on{background:var(--hl)}
.n{color:var(--ac);font-weight:400;font-size:.7em;margin:0 3px}
.blk .ay{display:block;padding:10px 0;border-bottom:1px solid var(--bd)}
.ex{font-family:Cairo;font-size:15px;line-height:1.8;color:var(--mut);text-align:start;margin-top:4px}
.ex.en{direction:ltr;text-align:left}
#bar{position:fixed;inset-inline:0;bottom:calc(49px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);padding:8px 12px;display:none;gap:6px;align-items:center;flex-wrap:wrap;z-index:6}
#bar select{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px;font:inherit;flex:1;min-width:0}
#sheet{position:fixed;inset-inline:0;bottom:0;max-height:75vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--bd);padding:18px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.25s;z-index:10;box-shadow:0 -10px 30px #0004}
#sheet.o{transform:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opt{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.opt button.on{background:var(--ac);color:#fff}
.mut{color:var(--mut);text-align:center;padding:30px}

:root{--nav-h:68px;--player-h:62px}
body{overflow-x:hidden}
#main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px)}
body.reader-active #main{padding-bottom:calc(var(--nav-h) + var(--player-h) + env(safe-area-inset-bottom) + 35px)}
nav{min-height:var(--nav-h);align-items:stretch;gap:0}
nav button{min-width:0;min-height:var(--nav-h);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap;line-height:1.25;font-size:clamp(10px,2.9vw,13px)}
nav .nav-icon{font-size:22px;line-height:1.15}
#bar{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));min-height:var(--player-h);padding:8px 12px;gap:8px;flex-wrap:nowrap;box-shadow:0 -4px 18px #0000000d}
#bar .audio-toggle{flex:1;min-width:0;text-align:start;display:flex;align-items:center;gap:7px;overflow:hidden;border:0;background:transparent;padding:5px 2px}
#bar .audio-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#bar .chevron{font-size:13px;color:var(--mut)}
#bar .audio-main{display:flex;align-items:center;gap:6px;flex-shrink:0}
#bar .audio-main button{padding:7px 9px;min-width:36px}
#bar .audio-extra{display:none;position:absolute;bottom:100%;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);padding:14px 16px;box-shadow:0 -8px 18px #00000012;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
#bar.expanded .audio-extra{display:grid}
#bar .audio-extra label{grid-column:1/-1;font-size:12px;color:var(--mut)}
#bar .audio-extra select{width:100%;min-width:0}
#bar .audio-hide{font-size:12px;color:var(--mut);border:0;background:transparent;padding:6px}
#restore-audio{display:none;position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);inset-inline-end:12px;z-index:7;background:var(--ac);color:white;border:0;border-radius:100px;box-shadow:0 4px 15px #0003;padding:9px 14px;font-size:13px}
body.audio-hidden #restore-audio{display:block}
body.audio-hidden #main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 30px)}
#sheet{max-height:min(80dvh,680px);overscroll-behavior:contain}
@media(max-width:360px){nav .nav-icon{font-size:19px}nav button{font-size:10px}#bar{padding:7px 8px;gap:3px}#bar .audio-main{gap:2px}#bar .audio-main button{padding:6px;min-width:30px}}

/* Exact Madani mushaf page viewer */
.mushaf-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 auto 10px;max-width:650px}
.mushaf-tools button{padding:8px 11px;font-size:13px}
.mushaf-tools .page-indicator{font-weight:700;text-align:center;flex:1;font-size:14px}
.mushaf-frame{max-width:650px;margin:auto;background:#fff;border:1px solid var(--bd);border-radius:8px;overflow:hidden;box-shadow:0 2px 14px #00000012;position:relative}
.mushaf-frame img{display:block;width:100%;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
.mushaf-frame .image-error{padding:40px 15px;text-align:center;color:#922}
.mushaf-caption{text-align:center;font-size:12px;color:var(--mut);margin:9px 0}
.page-ayah-list{max-width:650px;margin:12px auto}
.page-ayah-list summary{cursor:pointer;text-align:center;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.page-ayah-list .row{margin-top:7px}
.page-ayah-list .ar{font-size:19px;line-height:1.9}
.page-ayah-list .row.active{border-color:var(--ac);background:var(--hl)}
.mushaf-jump{display:flex;gap:7px;align-items:center;justify-content:center;margin:10px auto;max-width:650px}
.mushaf-jump input{width:86px;text-align:center;font:inherit;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--fg);padding:7px}
@media(min-width:700px){.mushaf-frame{max-width:540px}}
</style>
</head>
<body>
<header><button id="back" hidden>→</button><h1 id="ttl">المصحف الشريف</h1><button id="set">⚙️</button></header>
<div id="main"></div>
<div id="bar" role="region" aria-label="مشغل التلاوة">
 <button id="audio-expand" class="audio-toggle" aria-expanded="false"><span class="chevron">⌃</span><span class="audio-title" id="audio-title">مشغل التلاوة</span></button>
 <div class="audio-main"><button id="pv" aria-label="الآية السابقة">⏮</button><button id="pp" class="p" aria-label="تشغيل أو إيقاف">▶</button><button id="nx" aria-label="الآية التالية">⏭</button></div>
 <button id="audio-hide" class="audio-hide" aria-label="إخفاء المشغل">✕</button>
 <div class="audio-extra"><label for="rec">القارئ وإعدادات التلاوة</label><select id="rec"></select><button id="spd">1×</button><button id="rep">🔁 1</button></div>
</div>
<button id="restore-audio" aria-label="إظهار مشغل التلاوة">♫ المشغل</button>
<nav id="nav"></nav>
<div id="sheet"></div>
<script>
const $=s=>document.querySelector(s),AR=n=>(+n).toLocaleString('ar-EG');
const RECS={'ar.alafasy':['مشاري العفاسي',128],'ar.husary':['الحصري',128],'ar.minshawi':['المنشاوي (مرتل)',128],'ar.abdulbasitmurattal':['عبد الباسط (مرتل)',64],'ar.ahmedajamy':['أحمد العجمي',128]};
let S=Object.assign({theme:'light',fs:28,tr:false,taf:false,rec:'ar.alafasy',spd:1,rep:1,bm:[],last:null},JSON.parse(localStorage.quran||'{}'));
const save=()=>localStorage.quran=JSON.stringify(S);
const api=async p=>{const r=await fetch('https://api.alquran.cloud/v1/'+p);if(!r.ok)throw 0;return (await r.json()).data};
let tab='surah',surahs=[],ays=[],cur=-1,repN=0,reading=false,ctx=null,page=1,pageToken=0;const pageCache=new Map();const PAGE_IMAGE='https://raw.githubusercontent.com/Miftah-Fentaw/Quran_webp/main/png/';
const au=new Audio();

function applyTheme(){document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty('--fs',S.fs+'px');save()}
function nav(){const t=[['surah','📖','السور'],['juz','🧩','الأجزاء'],['bm','🔖','المحفوظات'],['search','🔍','بحث']];
 $('#nav').innerHTML=t.map(([k,ico,l])=>`<button data-k="${k}" class="${tab==k&&!reading?'on':''}"><span class="nav-icon" aria-hidden="true">${ico}</span><span class="nav-label">${l}</span></button>`).join('');
 $('#nav').onclick=e=>{const k=e.target.closest('button[data-k]')?.dataset.k;if(k){tab=k;closeReader();home()}}}
function closeReader(){reading=false;document.body.classList.remove('reader-active','audio-hidden');$('#bar').classList.remove('expanded');au.pause();$('#bar').style.display='none';$('#back').hidden=true;$('#ttl').textContent='المصحف الشريف';nav()}
$('#back').onclick=()=>{closeReader();home()};

async function home(){
 const m=$('#main');nav();
 if(tab=='surah'){
  if(!surahs.length){m.innerHTML='<div class="mut">جاري التحميل…</div>';try{surahs=await api('surah')}catch{m.innerHTML='<div class="mut">تعذّر التحميل، تأكد من الاتصال</div>';return}}
  const last=S.last?`<div class="row" id="lr" style="border-color:var(--ac)"><div class="t">▶ أكمل من آخر موضع<br><small>${S.last.name} · صفحة ${AR(S.last.page||1)}</small></div></div>`:'';
  m.innerHTML=last+'<input type="search" id="q" placeholder="ابحث عن سورة…"><div id="l"></div>';
  const draw=f=>$('#l').innerHTML=surahs.filter(s=>!f||s.name.includes(f)||s.englishName.toLowerCase().includes(f.toLowerCase())||String(s.number)==f).map(s=>`<div class="row" data-n="${s.number}"><div class="num">${AR(s.number)}</div><div class="t"><b class="ar" style="font-size:20px">${s.name}</b><br><small>${s.englishName} · ${AR(s.numberOfAyahs)} آية · ${s.revelationType=='Meccan'?'مكية':'مدنية'}</small></div></div>`).join('');
  draw();$('#q').oninput=e=>draw(e.target.value.trim());
  $('#l').onclick=e=>{const r=e.target.closest('.row');if(r)openReader('surah',+r.dataset.n)};
  if($('#lr'))$('#lr').onclick=()=>openReader('page',S.last.page||1);
 }else if(tab=='juz'){
  m.innerHTML='<div class="grid">'+Array.from({length:30},(_,i)=>`<button data-n="${i+1}">${AR(i+1)}</button>`).join('')+'</div>';
  m.onclick=e=>{const n=e.target.dataset.n;if(n&&tab=='juz')openReader('juz',+n)};
 }else if(tab=='bm'){
  m.innerHTML=S.bm.length?S.bm.map((b,i)=>`<div class="row" data-i="${i}"><div class="num">${AR(b.ay)}</div><div class="t"><b>${b.name}</b><br><small class="ar" style="font-size:16px">${b.text}…</small></div><button data-d="${i}">🗑</button></div>`).join(''):'<div class="mut">لا توجد علامات بعد. اضغط على أي آية لإضافتها.</div>';
  m.onclick=e=>{const d=e.target.dataset.d;if(d!=null){S.bm.splice(+d,1);save();home();return}const r=e.target.closest('.row');if(r){const b=S.bm[+r.dataset.i];openReader('surah',b.n,b.ay)}};
 }else{
  m.innerHTML='<input type="search" id="q" placeholder="ابحث في القرآن (بدون تشكيل)…"><div id="l"></div>';
  let tm;$('#q').oninput=e=>{clearTimeout(tm);const v=e.target.value.trim();if(v.length<3){$('#l').innerHTML='';return}
   tm=setTimeout(async()=>{$('#l').innerHTML='<div class="mut">جاري البحث…</div>';try{const d=await api('search/'+encodeURIComponent(v)+'/all/ar');
    $('#l').innerHTML=`<div class="mut" style="padding:6px">${AR(d.count)} نتيجة</div>`+d.matches.slice(0,60).map(x=>`<div class="row" data-n="${x.surah.number}" data-a="${x.numberInSurah}"><div class="t"><small>${x.surah.name} · ${AR(x.numberInSurah)}</small><div class="ar" style="font-size:20px;line-height:2">${x.text}</div></div></div>`).join('')}catch{$('#l').innerHTML='<div class="mut">لا نتائج</div>'}},400)};
  m.onclick=e=>{const r=e.target.closest('.row');if(r)openReader('surah',+r.dataset.n,+r.dataset.a)};
 }
}


async function pageData(p){
 if(pageCache.has(p))return pageCache.get(p);
 const d=await api('page/'+p+'/editions/quran-uthmani,ar.muyassar,en.sahih');
 const a=d[0].ayahs.map((x,i)=>({...x,taf:d[1].ayahs[i].text,en:d[2].ayahs[i].text}));
 pageCache.set(p,a);if(pageCache.size>8)pageCache.delete(pageCache.keys().next().value);return a;
}
async function openReader(type,n,focus){
 reading=true;au.pause();cur=-1;nav();$('#back').hidden=false;$('#main').onclick=null;
 $('#main').innerHTML='<div class="mut">جاري فتح صفحة المصحف…</div>';
 try{
  let p=n;
  if(type==='surah'){
   const d=await api('surah/'+n);
   p=focus?(d.ayahs.find(a=>a.numberInSurah===focus)?.page||d.ayahs[0].page):d.ayahs[0].page;
  }else if(type==='juz'){
   const d=await api('juz/'+n);
   p=d.ayahs[0].page;
  }
  ctx={type:'page',n:p,title:'المصحف الشريف'};
  $('#ttl').textContent='المصحف الشريف';
  $('#bar').style.display='flex';document.body.classList.add('reader-active');document.body.classList.remove('audio-hidden');
  await showPage(p,focus,type==='surah'?n:null);
 }catch(e){$('#main').innerHTML='<div class="mut">تعذّر فتح المصحف. تحقق من اتصال الإنترنت ثم حاول مرة أخرى.</div>'}
}
async function showPage(p,focus,focusSurah){
 if(p<1||p>604)return;
 const token=++pageToken;page=p;ctx.n=p;cur=-1;au.pause();$('#pp').textContent='▶';
 $('#main').innerHTML='<div class="mut">جاري تحميل الصفحة '+AR(p)+'…</div>';
 try{ays=await pageData(p)}catch(e){if(token===pageToken)$('#main').innerHTML='<div class="mut">تعذّر تحميل بيانات الصفحة. حاول الانتقال إليها مجددًا.</div>';return}
 if(token!==pageToken)return;
 const first=ays[0],last=ays[ays.length-1];
 const title=first.surah.name+(last.surah.number!==first.surah.number?' — '+last.surah.name:'');
 $('#ttl').textContent=title;
 $('#audio-title').textContent='صفحة '+AR(p)+' · '+RECS[S.rec][0];
 S.last={type:'page',n:p,page:p,ay:first.numberInSurah,name:first.surah.name};save();
 renderReader();
 window.scrollTo({top:0,behavior:'instant'});
 if(focus){
  const i=ays.findIndex(a=>a.numberInSurah===focus&&(!focusSurah||a.surah.number===focusSurah));
  if(i>=0){const details=$('#page-ayahs');details.open=true;setTimeout(()=>document.querySelector('.row[data-i="'+i+'"]')?.scrollIntoView({block:'center'}),60)}
 }
 // Preload adjacent paper page without rendering it.
 [p+1,p-1].filter(x=>x>=1&&x<=604).forEach(x=>{const im=new Image();im.src=PAGE_IMAGE+x+'.png'});
}
function renderReader(){
 const p=page,first=ays[0];
 const list=ays.map((a,i)=>`<div class="row ${i===cur?'active':''}" data-i="${i}"><div class="t"><small>${a.surah.name} · الآية ${AR(a.numberInSurah)}</small><div class="ar">${a.text}</div></div><button data-play="${i}" aria-label="استمع للآية">▶</button></div>`).join('');
 $('#main').innerHTML=`<div class="mushaf-tools"><button id="page-prev" ${p<=1?'disabled':''}>السابقة</button><span class="page-indicator">صفحة ${AR(p)} من ${AR(604)} · الجزء ${AR(first.juz)}</span><button id="page-next" ${p>=604?'disabled':''}>التالية</button></div>
 <div class="mushaf-frame"><img id="mushaf-image" src="${PAGE_IMAGE+p}.png" alt="صفحة ${AR(p)} من مصحف المدينة المنورة" draggable="false"></div>
 <div class="mushaf-caption">مصحف المدينة · رواية حفص · اضغط «آيات الصفحة» للاستماع أو التفسير أو الحفظ</div>
 <div class="mushaf-jump"><label for="jump-page">انتقل إلى صفحة</label><input id="jump-page" type="number" min="1" max="604" value="${p}" inputmode="numeric"><button id="jump-go">انتقال</button></div>
 <details class="page-ayah-list" id="page-ayahs"><summary>آيات الصفحة · استماع وتفسير ومحفوظات</summary><div id="page-verses">${list}</div></details>`;
 $('#mushaf-image').onerror=()=>{$('.mushaf-frame').innerHTML='<div class="image-error">تعذّر تحميل صورة الصفحة. تحقق من الإنترنت وأعد المحاولة.</div>'};
 $('#page-prev').onclick=()=>showPage(page-1);$('#page-next').onclick=()=>showPage(page+1);
 $('#jump-go').onclick=()=>{const x=Number($('#jump-page').value);if(Number.isInteger(x)&&x>=1&&x<=604)showPage(x)};
 $('#jump-page').onkeydown=e=>{if(e.key==='Enter')$('#jump-go').click()};
 $('#page-verses').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const i=+r.dataset.i;if(e.target.closest('[data-play]'))play(i);else openAyah(i)};
 let x0=null,y0=null;const frame=$('.mushaf-frame');
 frame.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
 frame.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)showPage(page+(dx>0?1:-1))},{passive:true});
}
const hl=()=>{document.querySelectorAll('.row.active').forEach(x=>x.classList.remove('active'));const el=document.querySelector('.row[data-i="'+cur+'"]');if(el){el.classList.add('active');if($('#page-ayahs')?.open)el.scrollIntoView({block:'nearest',behavior:'smooth'})}};
// ---- Audio
function play(i){if(i<0||i>=ays.length){au.pause();$('#pp').textContent='▶';return}
 cur=i;repN=0;au.src=`https://cdn.islamic.network/quran/audio/${RECS[S.rec][1]}/${S.rec}/${ays[i].number}.mp3`;au.playbackRate=S.spd;au.play();$('#pp').textContent='⏸';hl()}
au.onended=()=>{if(++repN<(S.rep||1)){au.currentTime=0;au.play()}else if(cur+1<ays.length)play(cur+1);else if(page<604)showPage(page+1).then(()=>play(0))};
$('#pp').onclick=()=>{if(au.paused&&au.src){au.play();$('#pp').textContent='⏸'}else if(au.paused)play(0);else{au.pause();$('#pp').textContent='▶'}};
$('#nx').onclick=()=>{if(cur+1<ays.length)play(cur+1);else if(page<604)showPage(page+1).then(()=>play(0))};$('#pv').onclick=()=>{if(cur>0)play(cur-1);else if(page>1)showPage(page-1).then(()=>play(ays.length-1))};
$('#rec').innerHTML=Object.entries(RECS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');$('#rec').value=S.rec;
$('#rec').onchange=e=>{S.rec=e.target.value;$('#audio-title').textContent=(ctx?.title||'المصحف')+' · '+RECS[S.rec][0];save();if(!au.paused)play(cur)};
$('#spd').onclick=()=>{const s=[1,1.25,1.5,.75];S.spd=s[(s.indexOf(S.spd)+1)%4];au.playbackRate=S.spd;$('#spd').textContent=S.spd+'×';save()};
$('#rep').onclick=()=>{const r=[1,3,5,10];S.rep=r[(r.indexOf(S.rep)+1)%4];$('#rep').textContent='🔁 '+S.rep;save()};
$('#spd').textContent=S.spd+'×';$('#rep').textContent='🔁 '+S.rep;

$('#audio-expand').onclick=()=>{const expanded=$('#bar').classList.toggle('expanded');$('#audio-expand').setAttribute('aria-expanded',String(expanded));$('#audio-expand .chevron').textContent=expanded?'⌄':'⌃'};
$('#audio-hide').onclick=()=>{$('#bar').classList.remove('expanded');document.body.classList.add('audio-hidden');$('#bar').style.display='none'};
$('#restore-audio').onclick=()=>{document.body.classList.remove('audio-hidden');$('#bar').style.display='flex'};
// ---- Sheets
const sh=h=>{$('#sheet').innerHTML=h;$('#sheet').classList.add('o')};
document.addEventListener('click',e=>{if($('#sheet').classList.contains('o')&&!e.target.closest('#sheet')&&!e.target.closest('.a')&&!e.target.closest('#set'))$('#sheet').classList.remove('o')});
function openAyah(i){const a=ays[i],k=a.surah.number+':'+a.numberInSurah,has=S.bm.some(b=>b.k==k);
 sh(`<b>${a.surah.name} · آية ${AR(a.numberInSurah)}</b><div class="acts"><button class="p" id="a1">▶ استمع من هنا</button><button id="a2">${has?'✅ محفوظة':'🔖 علامة'}</button><button id="a3">📋 نسخ</button><button id="a4">📤 مشاركة</button></div><div class="ex"><b>التفسير الميسر:</b><br>${a.taf}</div><div class="ex en"><b>Sahih International:</b><br>${a.en}</div>`);
 $('#a1').onclick=()=>{play(i);$('#sheet').classList.remove('o')};
 $('#a2').onclick=()=>{if(has)S.bm=S.bm.filter(b=>b.k!=k);else S.bm.unshift({k,n:a.surah.number,ay:a.numberInSurah,name:a.surah.name,text:a.text.split(' ').slice(0,6).join(' ')});save();openAyah(i)};
 const txt=`${a.text} ﴿${a.numberInSurah}﴾ [${a.surah.name}]`;
 $('#a3').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(txt);$('#a3').textContent='تم ✓'};
 $('#a4').onclick=()=>navigator.share?navigator.share({text:txt}):navigator.clipboard.writeText(txt);
}
$('#set').onclick=()=>{
 sh(`<b>الإعدادات</b>
 <div class="opt">المظهر: ${['light','dark','sepia'].map((t,i)=>`<button data-t="${t}" class="${S.theme==t?'on':''}">${['فاتح','داكن','سيبيا'][i]}</button>`).join('')}</div>
 <div class="opt">حجم الخط <input type="range" id="fs" min="20" max="48" value="${S.fs}" style="flex:1"></div>
 <div class="opt"><button id="ttr" class="${S.tr?'on':''}">الترجمة الإنجليزية</button><button id="ttf" class="${S.taf?'on':''}">التفسير الميسر</button></div>`);
 $('#sheet').onclick=e=>{const t=e.target.dataset.t;if(t){S.theme=t;applyTheme();$('#set').click()}};
 $('#fs').oninput=e=>{S.fs=+e.target.value;applyTheme()};
 $('#ttr').onclick=()=>{S.tr=!S.tr;save();$('#set').click();reading&&renderReader()};
 $('#ttf').onclick=()=>{S.taf=!S.taf;save();$('#set').click();reading&&renderReader()};
};
if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('nexttrack',()=>play(cur+1));navigator.mediaSession.setActionHandler('previoustrack',()=>play(cur-1))}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
applyTheme();home();
</script>
</body>
</html>
